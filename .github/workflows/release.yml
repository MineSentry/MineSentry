# GitHub で Release を公開すると、全ターゲットをビルドして jar を Release に添付し、
# MineSentry のダウンロードページに登録する。
#
# 必要な設定（Settings → Secrets and variables → Actions）:
#   secrets.MINESENTRY_RELEASE_TOKEN  Core の RELEASE_PUBLISH_TOKEN と同じ値
#   vars.MINESENTRY_API_URL           例: https://api.minesentry.com
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "登録するリリースのタグ（例: 1.2.0）"
        required: true
      register:
        description: "ダウンロードページに登録する（オフなら jar の添付と dry-run のみ）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # 時間のかかるビルドだけを分離し、成果物を artifact に残す。
  # publish が失敗しても「Re-run failed jobs」でビルドをやり直さずに済む。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 最後に書いたものが既定（Gradle 実行用）。他は toolchain として使われる
          java-version: |
            17
            21
            25

      # タグ実行ではキャッシュが読み取り専用になる（書き込みは既定ブランチのみ）。
      # キャッシュは main への push で build.yml が温めておく。
      - uses: gradle/actions/setup-gradle@v4

      - name: Build all targets
        run: bash ./gradlew releaseInfo

      - name: Pack release outputs
        run: |
          find . -type d -path '*/build/release' -not -path './build/release' -not -path '*/node_modules/*' -print0 \
            | tar --null -czf "$RUNNER_TEMP/release-build.tgz" -T -
          tar -tzf "$RUNNER_TEMP/release-build.tgz" | grep -c release-info.json

      - uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: ${{ runner.temp }}/release-build.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: release-build
          path: ${{ runner.temp }}

      - name: Unpack release outputs
        run: tar -xzf "$RUNNER_TEMP/release-build.tgz"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json body,publishedAt,isPrerelease > "$RUNNER_TEMP/release.json"
          jq -r '.body // ""' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/release-body.md"
          echo "RELEASE_BODY_FILE=$RUNNER_TEMP/release-body.md" >> "$GITHUB_ENV"
          echo "RELEASE_PUBLISHED_AT=$(jq -r '.publishedAt' "$RUNNER_TEMP/release.json")" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE=$(jq -r '.isPrerelease' "$RUNNER_TEMP/release.json")" >> "$GITHUB_ENV"

      - name: Collect jars (dry-run)
        run: node scripts/release/publish.mjs --tag "$TAG" --dry-run

      - name: Upload jars to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/release/*.jar build/release/manifest.json --clobber

      - name: Register on the download page
        if: github.event_name == 'release' || inputs.register
        env:
          MINESENTRY_API_URL: ${{ vars.MINESENTRY_API_URL }}
          MINESENTRY_RELEASE_TOKEN: ${{ secrets.MINESENTRY_RELEASE_TOKEN }}
        run: node scripts/release/publish.mjs --tag "$TAG"
